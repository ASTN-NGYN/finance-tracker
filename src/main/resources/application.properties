spring.application.name=financetracker


# ==============================================
# H2 DATABASE CONFIGURATION (For Learning/Testing)
# ==============================================
# Use this configuration first - it's easier to get started!

# H2 Database URL (in-memory)
spring.datasource.url=jdbc:h2:mem:financetracker
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (to view your database in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================
# POSTGRESQL CONFIGURATION (For Production Learning)
# ==============================================
# Comment out H2 config above and use this after you install PostgreSQL

# PostgreSQL Database URL
#spring.datasource.url=jdbc:postgresql://localhost:5432/financetracker
#spring.datasource.username=your_username
#spring.datasource.password=your_password
#spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL JPA Configuration
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# ==============================================
# GENERAL CONFIGURATION
# ==============================================
# Server port
server.port=8080

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG